app:
  description: 智能警务文书生成 —— 输入案情描述，选择文书类型，自动抽取要素并生成规范法律文书
  icon: 📄
  icon_background: '#1a3a5c'
  icon_type: emoji
  mode: workflow
  name: 警务文书智能生成
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/deepseek:0.0.15@725407927b04e236212083d20e92830d60fa944e42cd357ef6902c160414f6f1
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: 文书模板知识库ID（上传templates.json内容后获取）
    id: env-template-kb
    name: TEMPLATE_KB_ID
    value: ''
  - description: 法律法规知识库ID（上传laws.json内容后获取）
    id: env-law-kb
    name: LAW_KB_ID
    value: ''
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      - .txt
      - .doc
      - .docx
      allowed_file_types:
      - image
      - document
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: true
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: true
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: '我是警务文书智能生成助手。请描述案件情况并选择文书类型，我将为您生成规范的法律文书。支持以下10种文书：行政处罚决定书、检查笔录、现场勘查笔录、辨认笔录、搜查笔录、行政处罚告知笔录、调解协议书、扣押决定书、指认笔录、结案报告。'
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 2025年6月10日，张三在北京市朝阳区某商场盗窃手机一部，价值5000元。帮我生成行政处罚决定书。
    - 2025年5月20日晚，李四伙同王五在广州市天河区某小区入户盗窃现金2万元。生成检查笔录和指认笔录。
    - 2025年6月1日，赵六在成都市武侯区某路口醉酒驾驶被查获。帮我生成辨认笔录。
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: knowledge-retrieval
      id: start-to-template-retrieval
      source: start-node
      sourceHandle: source
      target: template-retrieval
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: knowledge-retrieval
      id: start-to-law-retrieval
      source: start-node
      sourceHandle: source
      target: law-retrieval
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: knowledge-retrieval
        targetType: llm
      id: template-to-llm-extract
      source: template-retrieval
      sourceHandle: source
      target: llm-extract
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: knowledge-retrieval
        targetType: llm
      id: law-to-llm-polish
      source: law-retrieval
      sourceHandle: source
      target: llm-extract
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: llm
      id: llm-extract-to-llm-polish
      source: llm-extract
      sourceHandle: source
      target: llm-polish
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: code
      id: llm-polish-to-code-fill
      source: llm-polish
      sourceHandle: source
      target: code-fill-template
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
      id: code-to-end
      source: code-fill-template
      sourceHandle: source
      target: end-node
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 输入案件描述并选择要生成的文书类型
        selected: false
        title: 案件信息输入
        type: start
        variables:
        - hint: 请详细描述案件经过，包括时间、地点、人物、行为、结果等要素
          label: 案情描述
          max_length: 5000
          options: []
          placeholder: '例如：2025年6月10日14时许，张三（男，身份证号110101199001011234）在北京市朝阳区某商场内盗窃一部iPhone 15手机，价值5000元。被商场保安当场抓获，民警到场后将张三传唤至朝阳分局XX派出所接受调查。'
          required: true
