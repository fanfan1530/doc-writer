          扣押物品：{{items_seized}}

          被搜查人：__________
          执行人：__________
          见证人：__________
          日期：__________""",
              }

              if doc_type in templates:
                  return templates[doc_type]

              # 通用模板
              return """{{police_station}}
          {{doc_type}}

          案件编号：{{case_number}}

          当事人：{{party_name}}
          案件性质：{{case_nature}}

          {{illegal_fact}}

          {{investigation_summary}}

          承办人：{{officer_name}}
          日期：{{submission_date}}"""
