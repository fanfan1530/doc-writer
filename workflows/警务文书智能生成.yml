      targetPosition: left
      type: custom
      width: 240
    - data:
        dataset_ids: []
        model:
          completion_params: {}
          mode: chat
          name: ''
          provider: ''
        multiple_retrieval_config: null
        query:
          operation: and
          variable_selector:
          - start-node
          - case_text
        retrieval_mode: hybrid
        retrieve_config:
          reranking_enabled: true
          top_k: 5
          score_threshold: 0.3
          enable_deduplication: true
          enable_weighted_score: false
        selected: false
        title: 检索相关法条
        type: knowledge-retrieval
        variable_entity_map: {}
