    - data:
        code: "def main(text):\n    if isinstance(text, list):\n        return {'flat_text':\
          \ chr(10).join(str(t) for t in text)}\n    return {'flat_text': str(text)\
          \ if text else ''}\n"
        code_language: python3
        outputs:
          flat_text:
            type: string
        selected: false
        title: 文本合并
        type: code
        variables:
        - value_selector:
          - doc-extractor
          - text
          variable: text
