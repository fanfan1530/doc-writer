          \ or elements.get('illegal_fact') or case_text_clean\n        fact_text\
          \ = _ensure_violation_sentence(fact_source, violation_name)\n        content\
          \ = _build_penalty_decision(elements, fact_text)\n\n    output_content =\
          \ content.strip() if doc_type in ('检查笔录', '辨认笔录', '入所表', '前科证明') else _clean_content(content)\n\
          \    return {\n        'content': output_content,\n        'doc_type': doc_type,\n\
