          \ str = ''\n) -> dict:\n    classified_doc_type = ''\n    case_nature =\
          \ ''\n    try:\n        classify = _extract_json_block(classify_text)\n\
          \        classified_doc_type = classify.get('doc_type', '') or ''\n    \
          \    case_nature = classify.get('case_nature', '') or ''\n    except Exception:\n\
          \        pass\n\n    elements = {}\n    laws = []\n    try:\n        extract\
          \ = _extract_json_block(extract_text)\n        if isinstance(extract, dict):\n\
          \            elements = extract.get('elements', {}) or {}\n            if\
          \ not case_nature:\n                case_nature = extract.get('case_nature',\
          \ '') or ''\n            if not case_nature and isinstance(elements, dict):\n\
          \                case_nature = elements.get('violation_type', '') or ''\n\
          \            laws = extract.get('suggested_laws', []) or []\n    except\
          \ Exception:\n        pass\n\n    for key, value in list(elements.items()):\n\
          \        if value is None:\n            elements[key] = ''\n        elif\
          \ isinstance(value, str) and value.strip().lower() in ('null', 'none'):\n\
          \            elements[key] = ''\n\n    doc_type = _normalize_doc_type(selected_doc_type,\
          \ classified_doc_type)\n    polish_clean = _clean_content(polish_text)\n\
          \    case_text_clean = _clean_content(case_text)\n    violation_name = _normalize_violation(elements.get('violation_type')\
          \ or case_nature)\n    if violation_name:\n        case_nature = violation_name\n\
          \        elements['violation_type'] = violation_name\n\n    if doc_type\
          \ == '入所表':\n        if polish_clean and not elements.get('entry_fact'):\n\
          \            elements['entry_fact'] = polish_clean\n        content = '入所材料'\n\
          \    elif doc_type == '前科证明':\n        content = _build_criminal_record_certificate(elements)\n\
          \    elif doc_type == '检查笔录':\n        content = _build_check_record(elements,\
