          \  recorder_name = _first(elements.get('recorder_name'))\n    start_time\
          \ = _normalize_datetime(_first(elements.get('identification_time_start'),\
          \ elements.get('identification_time'), elements.get('case_date')))\n   \
          \ end_time = _normalize_datetime(_first(elements.get('identification_time_end'),\
          \ start_time))\n    location = _first(elements.get('identification_location'),\
          \ elements.get('case_location'), f'{handling_unit}询问室')\n    identify_object\
          \ = _first(elements.get('identification_object'), elements.get('recognition_object'),\
          \ '十二张不同人员正面彩色免冠照片组')\n    purpose = _first(elements.get('identification_purpose'),\
          \ elements.get('recognition_purpose'))\n    if not purpose:\n        if\
          \ violation:\n            purpose = f'让辨认人辨别确认照片中是否有涉嫌{violation}的相关人员。'\n\
          \        else:\n            purpose = '让辨认人辨别确认照片中是否有相关人员。'\n    process\
          \ = _compact_identification_process(\n        _first(\n            _source_identification_process(case_text),\n\
          \            elements.get('identification_process'),\n            elements.get('recognition_process'),\n\
          \            polish_text,\n        ),\n        identifier_name,\n      \
          \  case_text,\n    )\n    results = _identification_result_lines(\n    \
          \    _first(elements.get('identification_results'), elements.get('recognition_results'),\
          \ elements.get('result_lines')),\n        case_text,\n    )\n    while len(results)\
          \ < 5:\n        results.append('')\n\n    lines = [\n        ' 辨 认 笔 录',\n\
          \        f'时间：{start_time}至{end_time}' if start_time and end_time else f'时间：{start_time\
          \ or end_time}',\n        f'地点：{location}',\n        f'办案人员姓名、单位：      \
          \                  {handling_unit}',\n        f'辨认人姓名：{identifier_name}\
          \  地址：{identifier_address}',\n        f'见证人姓名、单位：{witness_name} {witness_unit}\
          \     住址：{witness_address}',\n        f'辨认对象：{identify_object}',\n     \
          \   f'辨认目的：{purpose}',\n        '辨认过程及结果：',\n        process,\n        f'辨认人{identifier_name}将所有照片认真仔细的审视了一遍，然后指出来：',\n\
          \        results[0],\n        results[1],\n        results[2],\n       \
          \ results[3],\n        results[4],\n        '',\n        '',\n        '至此，辨认结束。',\n\
          \        f'办案人员：{officers}\\u3000\\u3000\\u3000        \\u3000    记录人：{recorder_name}\\\
          u3000\\u3000\\u3000\\u3000',\n        f'见证人：{witness_name}             \
          \         辨认人：{identifier_name}\\u3000\\u3000\\u3000\\u3000',\n    ]\n \
          \   return '\\n\\n'.join(lines)\n\n\ndef _build_penalty_decision(elements:\
          \ dict, fact_text: str) -> str:\n    elements['police_station'] = elements.get('police_station')\
          \ or '藤县公安局'\n    elements['doc_number'] = elements.get('doc_number') or\
          \ _default_doc_number(elements['police_station'])\n    elements['work_unit']\
          \ = elements.get('work_unit') or '无'\n    elements['criminal_record'] =\
          \ elements.get('criminal_record') or '无'\n    elements['illegal_fact'] =\
          \ fact_text\n    elements['evidence_list'] = elements.get('evidence_list')\
          \ or '检查笔录、违法行为人的陈述和申辩、其他证据'\n    elements['penalty_basis'] = elements.get('penalty_basis')\
          \ or '《中华人民共和国治安管理处罚法》相关规定'\n    elements['penalty_content'] = elements.get('penalty_content')\
          \ or '依法作出相应行政处罚'\n    elements['execution_detail'] = elements.get('execution_detail')\
          \ or '收到决定书之日起15日内按照本决定执行。'\n    elements['reconsideration_org'] = elements.get('reconsideration_org')\
          \ or '藤县人民政府'\n    elements['lawsuit_court'] = elements.get('lawsuit_court')\
          \ or '藤县人民法院'\n    elements['stamp_date'] = elements.get('stamp_date') or\
          \ date.today().strftime('%Y-%m-%d')\n\n    evidence_text = _trim_final_punct(elements.get('evidence_list',\
          \ ''))\n    penalty_basis_text = _trim_final_punct(elements.get('penalty_basis',\
          \ ''))\n    basis_suffix = '' if penalty_basis_text.endswith('规定') else\
          \ '之规定'\n    return '\\n\\n'.join([\n        elements['police_station'],\n\
          \        '行政处罚决定书',\n        elements['doc_number'],\n        f\"违法行为人{elements.get('party_name',\
          \ '')}，{elements.get('party_gender', '')}，{elements.get('party_age', '')}岁，居民身份证号码{elements.get('party_id_number',\
          \ '')}，{elements.get('birth_date', '')}出生，籍贯：{elements.get('native_place',\
          \ '')}，户籍：{elements.get('household_register', '')}，现住：{elements.get('party_address',\
          \ '')}，工作单位：{elements.get('work_unit', '')}，违法犯罪经历：{elements.get('criminal_record',\
          \ '')}。\",\n        elements['illegal_fact'],\n        f\"上述事实有以下证据证实：{evidence_text}。\"\
          ,\n        f\"根据{penalty_basis_text}{basis_suffix}，现决定对违法行为人{elements.get('party_name',\
          \ '')}处以{elements.get('penalty_content', '')}。\",\n        f\"执行方式和期限：{elements.get('execution_detail',\
          \ '')}\",\n        '逾期不履行的，依法承担相应法律后果。',\n        '一式四份，被处罚人和执行单位各一份，一份附卷。',\n\
          \        f\"如不服本决定，可以在收到本决定书之日起六十日内向{elements.get('reconsideration_org',\
          \ '')}申请行政复议或者在六个月内向{elements.get('lawsuit_court', '')}提起行政诉讼。\",\n    \
          \    '附：清单共  份',\n        elements['police_station'],\n        elements['stamp_date'],\n\
          \        '行政处罚决定书已向我宣告并送达。',\n        '被处罚人:                        被侵害人：',\n\
          \        '年    月    日                  年    月    日',\n        '接收人员：',\n\
          \        '接收单位（印）',\n        '年    月    日',\n        '案件编号：',\n        '人员编号：',\n\
          \    ])\n\n\ndef _build_criminal_record_certificate(elements: dict) -> str:\n\
          \    name = _first(elements.get('party_name'), elements.get('person_name'),\
          \ elements.get('checked_person_name'), elements.get('applicant_name'))\n\
          \    gender = _first(elements.get('party_gender'), elements.get('person_gender'),\
          \ elements.get('gender'))\n    id_type = _first(elements.get('id_type'),\
          \ elements.get('certificate_type')) or '居民身份证'\n    id_number = _first(elements.get('party_id_number'),\
          \ elements.get('id_number'), elements.get('person_id_number'))\n    birth\
          \ = _format_chinese_date(elements.get('birth_date'))\n    if not birth and\
          \ id_number:\n        parsed_birth = _birth_from_id(id_number)\n       \
          \ if parsed_birth:\n            birth = f'{parsed_birth.year:04d}年{parsed_birth.month:02d}月{parsed_birth.day:02d}日'\n\
          \    household_address = _first(\n        elements.get('household_address'),\n\
          \        elements.get('household_register_detail'),\n        elements.get('household_register'),\n\
          \        elements.get('party_address'),\n        elements.get('address'),\n\
          \    )\n    agency = _first(elements.get('issuing_agency'), elements.get('police_station'),\
          \ elements.get('handling_unit')) or '广西藤县公安局埌南派出所'\n    issue_date = _format_chinese_date(_first(elements.get('issue_date'),\
          \ elements.get('stamp_date')), default_today=True)\n    record_result =\
          \ _first(elements.get('criminal_record_result'), elements.get('criminal_record'))\
          \ or '未发现'\n    if '有' in record_result and '无' not in record_result and\
          \ '未发现' not in record_result:\n        result_line = f'经我所民警在全国违法犯罪人员信息资源库、全国在逃人员信息库、全国吸毒人员信息库、广西警务信息综合应用平台和我所档案室查找档案，在本证明出具之日前，发现{name}在本辖区居住期间有违法犯罪记录。'\n\
          \    else:\n        result_line = f'经我所民警在全国违法犯罪人员信息资源库、全国在逃人员信息库、全国吸毒人员信息库、广西警务信息综合应用平台和我所档案室查找档案，在本证明出具之日前，未发现{name}在本辖区居住期间有违法犯罪记录。'\n\
          \n    return '\\n\\n'.join([\n        '前科证明',\n        f'{name}，性别：{gender}\
